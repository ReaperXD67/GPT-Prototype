<?xml version="1.0" encoding="UTF-8"?>
<!-- Deterministic, self-hosted README visual. No third-party assets or runtime scripts. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">GPT Prototype animated project overview</title>
  <desc id="desc">A decoder-only language model built to expose the details frameworks usually hide. The visual shows four real stages in the project workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".58" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".075"/>
    </pattern>
    <filter id="glow" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow { fill:#F97316; font-size:13px; font-weight:800; letter-spacing:2.2px; }
      .title { fill:#FFF7ED; font-size:52px; font-weight:800; letter-spacing:-1.5px; }
      .tagline { fill:#CBD5E1; font-size:18px; font-weight:450; }
      .step { fill:#64748B; font-size:12px; font-weight:800; letter-spacing:1.5px; }
      .label { fill:#F8FAFC; font-size:19px; font-weight:800; letter-spacing:.5px; }
      .detail { fill:#94A3B8; font-size:14px; font-weight:500; }
      .footer { fill:#94A3B8; font-size:12px; font-weight:700; letter-spacing:1.4px; }
      .card { animation:lift 4.8s ease-in-out infinite; }
      .flow { stroke-dasharray:10 13; animation:dash 6s linear infinite; }
      @keyframes lift { 0%,100% { transform:translateY(0) } 50% { transform:translateY(-4px) } }
      @keyframes dash { to { stroke-dashoffset:-92 } }
      @media (prefers-reduced-motion: reduce) { .card,.flow { animation:none } .packet,.node { display:none } }
    </style>
  </defs>
  <rect width="1200" height="390" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="390" rx="24" fill="url(#grid)"/>
  <path d="M0 8H1200" stroke="url(#signal)" stroke-width="8"/>
  <circle cx="1100" cy="74" r="104" fill="#A855F7" opacity=".055"/>
  <circle cx="1028" cy="40" r="54" fill="#F97316" opacity=".06"/>
  <text x="48" y="45" class="eyebrow">125M TRANSFORMER FROM FIRST PRINCIPLES</text>
  <text x="48" y="94" class="title">GPT Prototype</text>
  <text x="48" y="118" class="tagline">A decoder-only language model built to expose the details frameworks usually hide.</text>
  <path d="M72 246 C190 160 288 330 405 246 S620 162 742 246 S952 330 1128 246" fill="none" stroke="url(#signal)" stroke-width="2" opacity=".36" class="flow"/>
  <circle r="7" fill="#FFF7ED" filter="url(#glow)" class="packet">
    <animateMotion dur="5.8s" repeatCount="indefinite" path="M72 246 C190 160 288 330 405 246 S620 162 742 246 S952 330 1128 246"/>
  </circle>

        <g class="card" style="animation-delay:0.0s">
          <rect x="48" y="184" width="246" height="124" rx="16" fill="#0B1220" stroke="#334155"/>
          <rect x="48" y="184" width="5" height="124" rx="3" fill="#F97316"/>
          <text x="70" y="215" class="step">01</text>
          <text x="70" y="249" class="label">TOKENIZE</text>
          <text x="70" y="280" class="detail">Prepare the corpus</text>
          <circle cx="268" cy="210" r="5" fill="#F97316" class="node">
            <animate attributeName="r" values="4;8;4" dur="2.4000000000000004s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;.35;1" dur="2.4000000000000004s" repeatCount="indefinite"/>
          </circle>
        </g>
        <g class="card" style="animation-delay:0.45s">
          <rect x="334" y="184" width="246" height="124" rx="16" fill="#0B1220" stroke="#334155"/>
          <rect x="334" y="184" width="5" height="124" rx="3" fill="#A855F7"/>
          <text x="356" y="215" class="step">02</text>
          <text x="356" y="249" class="label">TRAIN</text>
          <text x="356" y="280" class="detail">Causal transformer</text>
          <circle cx="554" cy="210" r="5" fill="#A855F7" class="node">
            <animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;.35;1" dur="2.6s" repeatCount="indefinite"/>
          </circle>
        </g>
        <g class="card" style="animation-delay:0.9s">
          <rect x="620" y="184" width="246" height="124" rx="16" fill="#0B1220" stroke="#334155"/>
          <rect x="620" y="184" width="5" height="124" rx="3" fill="#F97316"/>
          <text x="642" y="215" class="step">03</text>
          <text x="642" y="249" class="label">OPTIMIZE</text>
          <text x="642" y="280" class="detail">Muon and AdamW</text>
          <circle cx="840" cy="210" r="5" fill="#F97316" class="node">
            <animate attributeName="r" values="4;8;4" dur="2.8000000000000003s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;.35;1" dur="2.8000000000000003s" repeatCount="indefinite"/>
          </circle>
        </g>
        <g class="card" style="animation-delay:1.35s">
          <rect x="906" y="184" width="246" height="124" rx="16" fill="#0B1220" stroke="#334155"/>
          <rect x="906" y="184" width="5" height="124" rx="3" fill="#A855F7"/>
          <text x="928" y="215" class="step">04</text>
          <text x="928" y="249" class="label">GENERATE</text>
          <text x="928" y="280" class="detail">Sample checkpoints</text>
          <circle cx="1126" cy="210" r="5" fill="#A855F7" class="node">
            <animate attributeName="r" values="4;8;4" dur="3.0s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="1;.35;1" dur="3.0s" repeatCount="indefinite"/>
          </circle>
        </g>
  <rect x="48" y="338" width="1104" height="1" fill="#334155"/>
  <text x="48" y="366" class="footer">PYTORCH  /  APPROX. 125M PARAMETERS  /  1024 CONTEXT  /  REPRODUCIBLE RUNS</text>
  <g transform="translate(1093 350)">
    <circle cx="0" cy="0" r="5" fill="#F97316"/>
    <circle cx="18" cy="0" r="5" fill="#A855F7"/>
    <circle cx="36" cy="0" r="5" fill="#475569"/>
  </g>
  <rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="#334155"/>
</svg>
